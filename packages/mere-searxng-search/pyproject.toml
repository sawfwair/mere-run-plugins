[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mere-searxng-search"
version = "0.1.0"
description = "Search a user-configured SearXNG instance from mere.run workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sawfwair Inc. and mere.run contributors" }]
dependencies = []

[project.scripts]
mere-web-search = "mere_searxng_search.cli:main"
mere-searxng-search = "mere_searxng_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mere_searxng_search = ["py.typed", "resources/pi/package.json", "resources/pi/extensions/*.ts"]
