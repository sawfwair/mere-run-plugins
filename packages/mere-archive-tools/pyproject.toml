[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mere-archive-tools"
version = "0.1.0"
description = "Local shared-drive indexing and search workflows for mere.run"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Sawfwair Inc. and mere.run contributors" }
]
dependencies = [
  "firecrawl-anydoc>=0.2.4,<0.3; python_version >= '3.10'",
]

[project.scripts]
mere-archive-tools = "mere_archive_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mere_archive_tools = ["py.typed", "THIRD_PARTY_NOTICES.txt", "benchmarks/*.json", "benchmarks/harbourline/*.png"]
