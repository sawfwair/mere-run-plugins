[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mere-frontier-handoff"
version = "0.1.0"
description = "Local handoff to a user-authenticated frontier CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sawfwair Inc. and mere.run contributors" }]
dependencies = []

[project.scripts]
mere-frontier-handoff = "mere_frontier_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mere_frontier_handoff = ["py.typed"]
