[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mere-firecrawl-local"
version = "0.1.2"
description = "Read public web pages through a separately installed Firecrawl Local instance"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sawfwair Inc. and mere.run contributors" }]
dependencies = []

[project.scripts]
mere-firecrawl-local = "mere_firecrawl_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mere_firecrawl_local = ["py.typed", "resources/pi/extensions/*.ts"]
